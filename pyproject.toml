[project]
name = "dota-coach"
version = "0.1.0"
description = "Real-time Dota 2 coaching assistant that analyzes the live match and delivers strategic voice advice."
readme = "README.md"
authors = [
    { name = "asegura-dev", email = "Alejandro_segura85@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=6.0.0",
    "flask>=3.1.3",
    "ollama>=0.6.2",
    "python-dotenv>=1.2.2",
    "pyttsx3>=2.99",
    "rich>=15.0.0",
]

[project.scripts]
dota-coach = "dota_coach.__main__:main"
dota-context = "dota_coach.gui:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "customtkinter"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyttsx3"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
